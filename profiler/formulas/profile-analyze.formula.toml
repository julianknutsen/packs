description = """
Analyze a formula-run profile capture and write a narrative report.

The mechanical numbers come from `gc profiler report` (deterministic, cited);
this formula adds judgment on top: WHY the slow steps were slow, model-vs-
tool-vs-dispatch attribution from transcripts, which fixable layer owns each
finding, and concrete suggested edits for the profiled formula.

Launch inputs:
- root: {{root}} (workflow root bead id of the profiled run)
- capture_dir: {{capture_dir}} (empty means <city>/.gc/runtime/profiles/{{root}})
"""
formula = "profile-analyze"
version = 2

[requires]
formula_compiler = ">=2.0.0"

[catalog]
name = "profile-analyze"
description = "Write a narrative latency/cost analysis of a collected run profile."

[vars]
[vars.root]
description = "Workflow root bead id of the profiled run."

[vars.capture_dir]
description = "Profile capture directory. Empty means the default profiles location for {{root}}."
default = ""

[[steps]]
id = "analyze"
title = "Analyze run profile {{root}}"
metadata = { "gc.run_target" = "profiler.profile-analyst" }
description = """
Analyze the profile capture for workflow root {{root}}.

1. Resolve the capture directory: {{capture_dir}}, or
   <city>/.gc/runtime/profiles/{{root}} when empty. If no capture exists,
   run `gc profiler collect {{root}}` first (from the run's rig root).
2. Ensure the mechanical report exists:
   `gc profiler report {{root}} --json --html`.
3. Read report.json, manifest.json, and formula-provenance.json. For each of
   the top wait and top active steps, open the relevant transcript(s) in
   transcripts/ and attribute the time: model turns vs tool execution vs
   dispatch/idle. Do not invent numbers — every figure you state must come
   from the capture, and estimates must be labeled as estimates.
4. Write <capture>/analysis.md with:
   - a one-paragraph verdict (where the wall clock went, in plain language)
   - the top latency contributors, each tagged with its fixable layer:
     formula (step descriptions, gates, graph shape), config (warm floors,
     wake modes), or platform (dispatch, spawn) — with the evidence cited
     (step ids, transcript excerpts, event timestamps)
   - cost findings when usage data is present (tokens/cost per stage); note
     the missing dimension when it is not
   - concrete suggested edits for the profiled formula (which steps to
     script-gate, group same-session, prune, or re-shape for parallelism)
   - a "not measurable from this capture" section listing gaps rather than
     guessing
5. Set gc.outcome=pass and close this step only after analysis.md is
   written. Record the analysis path in the close metadata as
   gc.profile.analysis_path=<absolute path>.

This is a read-only analysis of capture data: do not modify the profiled
rig's source, beads, or artifacts.
"""
