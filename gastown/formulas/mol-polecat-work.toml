description = """
Polecat work lifecycle — feature-branch variant.

Extends mol-polecat-base with feature-branch workspace setup and
refinery-based submission. The polecat creates a feature branch,
implements the work, then pushes and reassigns to the refinery for
merge review.

## Polecat Contract (Self-Cleaning Model)

1. Receive work (molecule poured with this formula, assigned to you)
2. Follow steps in order (read descriptions, execute, move to next)
3. Submit: push branch, set metadata on work bead, assign to refinery, exit
4. You are GONE — Refinery merges, closes the bead

**No MR beads.** Work beads flow directly: pool → polecat → refinery → closed.
The polecat sets `metadata.branch` and `metadata.target` on the work bead
and reassigns it to the refinery. The refinery merges and closes.

**NEVER CLOSE BEADS.** You must not run `gc bd close` or set status=closed.
Even if you believe the code is already merged, reassign to refinery —
only the refinery verifies merges and closes beads.
`{{base_branch}}` may come from the work bead's own `metadata.target` or
be inherited from a parent convoy with `metadata.target` set.

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| binding_prefix | import binding | Agent identity prefix for bound Gas Town imports. |
| affected_tests_command | rig `formula_vars` | Shell-safe command that reads `git diff --name-only origin/{{base_branch}}...HEAD` and runs the matching test subset. Empty = run full `test_command`. |

**Rejection-aware.** If the work bead has `metadata.branch` and
`metadata.rejection_reason`, a previous attempt was rejected by the
refinery. Resume the existing branch — don't redo all the work.

## Failure Modes

| Situation | Action |
|-----------|--------|
| Tests fail | Fix them. Do not proceed with failures. |
| Blocked on external | Mail Witness, then stop via Escalation in your prompt (records `blocked_reason` before the status flip) |
| Context filling | `gc runtime request-restart` (blocks until controller kills you) |
| Unsure what to do | Mail Witness, don't guess |"""
formula = "mol-polecat-work"
extends = ["mol-polecat-base"]

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.binding_prefix]
description = "Import binding prefix for gastown agent identities, including trailing dot when bound."
default = ""

[vars.affected_tests_command]
description = "Shell-safe affected-tests command. Must read `git diff --name-only origin/{{base_branch}}...HEAD` and run the matching test subset. From rig `formula_vars` or empty to run full test_command."
default = ""

[[steps]]
id = "workspace-setup"
title = "Set up worktree and feature branch"
needs = ["load-context"]
description = """
Ensure you have an isolated git worktree and a clean feature branch.
Every check is idempotent — safe to re-run after crash/restart.

**Config: base_branch = {{base_branch}}**
**Config: setup_command = {{setup_command}}**

`{{base_branch}}` is resolved by `gc sling` in this order:
1. `metadata.target` on the work bead
2. `metadata.target` on the parent convoy chain
3. the rig repo's default branch

**1. Fetch latest and derive your work bead:**
```bash
git fetch --prune origin
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-polecat-work requires an input convoy with exactly one tracked member" >&2
  gc runtime drain-ack
  exit 1
fi
# Clear any stale handoff marker before touching the work. A fresh attempt on
# this bead means a prior submit-and-exit step 5 no longer describes it, and a
# leftover marker would let the witness's Step 3a hand un-submitted work to the
# refinery if this attempt also crashes. Unconditional on purpose: a bead can
# arrive here carrying the marker with no rejection_reason (witness pool reset,
# operator re-sling), so clearing only on the rejection path is not enough.
gc bd update "$WORK_BEAD_ID" --unset-metadata handoff_stage
```

**2. Ensure worktree exists.**

Check if `metadata.work_dir` already records your worktree path:
```bash
WORKTREE=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.work_dir // empty')
```

**If worktree path exists in metadata** — reuse it:
```bash
cd "$WORKTREE"              # Enter existing worktree
```
If the directory is missing (witness cleaned it, disk issue), fall through
to create a new one.

**If no worktree** — create one scoped to the bead, not the agent:
```bash
WORKTREE_PATH=$(pwd)/worktrees/"$WORK_BEAD_ID"
git worktree add "$WORKTREE_PATH" --detach origin/{{base_branch}}
cd "$WORKTREE_PATH"
```
Record immediately so restarts and witness recovery can find it:
```bash
gc bd update "$WORK_BEAD_ID" --set-metadata work_dir="$WORKTREE_PATH"
```

Worktrees are scoped to the work bead (not the agent name) so that:
- An agent can pick up new work even if an old worktree is being recovered
- Multiple orphaned worktrees can coexist without collision
- The witness cleans them independently per-bead

**3. Ensure branch exists.**

Check if `metadata.branch` already records a branch:
```bash
BRANCH=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.branch // empty')
```

**If branch exists in metadata** — treat it as authoritative. This
metadata may come from rejection recovery or from a caller that wants
work applied to an existing branch. Fetch the named remote branch first.
If `origin/$BRANCH` exists, make the local branch fast-forward to that
remote tip or stop on divergence:
```bash
git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || \
    echo "Could not fetch metadata.branch=$BRANCH from origin. Checking local refs before stopping."
if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
    if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
        git checkout "$BRANCH" || exit 1
        git merge --ff-only "origin/$BRANCH" || {
            echo "Local branch $BRANCH diverged from origin/$BRANCH."
            echo "STOP. Reconcile the branch before continuing."
            gc runtime drain-ack
            exit 1
        }
    else
        git checkout --track -b "$BRANCH" "origin/$BRANCH" || exit 1
    fi
elif git show-ref --verify --quiet "refs/heads/$BRANCH"; then
    git checkout "$BRANCH" || exit 1
else
    echo "metadata.branch=$BRANCH was set but no local or origin branch exists."
    echo "STOP. Do not create a different branch."
    gc runtime drain-ack
    exit 1
fi
```
If resuming a rejected branch, rebase onto latest base:
```bash
REJECTION=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.rejection_reason // empty')
if [ -n "$REJECTION" ]; then
    git rebase origin/{{base_branch}}
    # If conflicts: resolve them (this is likely the rejection reason)
    # After resolving: git rebase --continue
    gc bd update "$WORK_BEAD_ID" \
      --unset-metadata rejection_reason \
      --set-metadata fork_sha="$(git rev-parse "origin/{{base_branch}}")"
fi
```

**If no branch** — create one and record it. Always branch from the
freshly-fetched `origin/{{base_branch}}`, never from local
{{base_branch}} or whatever branch happens to be checked out.
Polecat worktrees are reused across beads, so the local copy of
{{base_branch}} may lag the remote — branching from a stale local ref
inherits already-merged commits with stale hashes and causes the next
refinery rebase to reject for spurious "duplicate" conflicts.

```bash
git fetch origin {{base_branch}}                     # ensure origin ref is current
BRANCH="polecat/$WORK_BEAD_ID"
git branch -D "$BRANCH" 2>/dev/null || true          # drop any stale local branch with the same name
git checkout -B "$BRANCH" "origin/{{base_branch}}"   # force-create from the freshly-fetched remote tip
gc bd update "$WORK_BEAD_ID" \
  --set-metadata branch="$BRANCH" \
  --set-metadata fork_sha="$(git rev-parse "origin/{{base_branch}}")"
```

Recording the branch early means:
- Witness can find and salvage your work if you crash
- Rejection-aware resume knows which branch to check out
- The submit step updates the metadata (branch may change after rebase)

`fork_sha` is the base commit this branch was cut from. The refinery uses it to
tell a genuine already-merged branch (>=1 commit since fork) from a starved
0-commit branch (tip still at the fork point) when both look like ancestors of
the target.

**4. Ensure clean working state:**
```bash
git status                  # Should be clean
```

**5. Run project setup (if configured):**
```bash
{{setup_command}}
```
Empty setup_command → skip.

**Exit criteria:** In your worktree, on a clean feature branch, rebased
on latest {{base_branch}}, deps installed, worktree and branch recorded
on the bead."""

[[steps]]
id = "self-review"
title = "Self-review and run tests (affected-aware)"
needs = ["implement"]
description = """
Review your changes and verify they work. Override of mol-polecat-base
`self-review` to support affected-test detection — when the rig configures
`affected_tests_command`, only the tests touched by your diff run, instead
of the full suite. Saves polecat time and reduces CI clog from PRs whose
locally-runnable failures should have been caught before push.

**Config: setup_command = {{setup_command}}**
**Config: typecheck_command = {{typecheck_command}}**
**Config: lint_command = {{lint_command}}**
**Config: build_command = {{build_command}}**
**Config: test_command = {{test_command}}**
**Config: affected_tests_command = {{affected_tests_command}}**

**1. Review the diff:**
```bash
git diff origin/{{base_branch}}...HEAD
git log --oneline origin/{{base_branch}}..HEAD
git diff --stat origin/{{base_branch}}...HEAD
```

Check for: bugs, security issues, style violations, missing error handling,
debug cruft, unintended file changes. Fix anything you find.

**2. Run quality checks (skip empty commands):**
```bash
{{setup_command}}
{{typecheck_command}}
{{lint_command}}
{{build_command}}
```

**3. Run tests — affected subset if rig provides one, full suite otherwise:**
```bash
if [ -n "{{affected_tests_command}}" ]; then
    # Rig has an affected-tests detector. Run only the tests our diff
    # touches — same logic the rig's CI uses to dispatch test workflows.
    # The command must read `git diff --name-only origin/{{base_branch}}...HEAD`
    # internally and execute the relevant test subset.
    {{affected_tests_command}}
else
    # No affected detector — run the full suite (legacy behavior).
    {{test_command}}
fi
```

**ALL CHECKS MUST PASS.** If your change caused the failure, fix it.
If pre-existing, file a bead.

Refusing to push on local failure is a feature: the rig's CI will run the
same affected subset (and more), and a PR that already fails locally will
fail in CI too — wasting reviewer attention and CI minutes. Fix before
submitting.

**4. Ensure everything is committed:**
```bash
git status                  # Must be clean
git log origin/{{base_branch}}..HEAD --oneline  # Must show your commits
```

If uncommitted changes exist, commit them with a body explaining what
slipped through the `implement` step (typically a self-review touch-up,
test addition, or formatter run):
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
git add -A
git commit -m "<type>: <imperative subject> ($WORK_BEAD_ID)" -m "$(cat <<'BODY'
<Explain what these residual changes are: a self-review fix,
test-only addition, formatter run, etc. Be specific.>
BODY
)"
```

NEVER discard implementation changes with `git checkout -- .`

**Exit criteria:** All checks pass (affected subset OR full suite), all
changes committed, working tree clean."""

[[steps]]
id = "submit-and-exit"
title = "Submit work to refinery and exit"
needs = ["self-review"]
description = """
Hand off your work and self-clean. You cease to exist after this step.

**1. Branch-shape gate (fails closed — non-negotiable).**

Before anything else, verify you are on a per-bead branch. The refinery
merges the branch recorded in your bead's `metadata.branch`, which must
follow the `polecat/<bead-id>` convention; if you push from a different
branch (your agent home branch, a stray local checkout, etc.), the
handoff contract is broken and the bead is permanently stranded as
"assigned to refinery, no merge target". See gastownhall/gascity#2082.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
CURRENT_BRANCH=$(git branch --show-current)
EXPECTED_BRANCH="polecat/$WORK_BEAD_ID"
if [ "$CURRENT_BRANCH" != "$EXPECTED_BRANCH" ]; then
    echo "BRANCH SHAPE GATE FAILED"
    echo "  current branch:  $CURRENT_BRANCH"
    echo "  expected branch: $EXPECTED_BRANCH"
    echo ""
    echo "Refinery handoff merges metadata.branch, which must be 'polecat/<bead-id>'."
    echo "Pushing this commit and reassigning to refinery would strand the work."
    echo ""
    echo "Recover by re-running the workspace-setup step:"
    echo "  - Create the per-bead worktree at \\$(pwd)/worktrees/$WORK_BEAD_ID"
    echo "  - Create branch '$EXPECTED_BRANCH' from origin/{{base_branch}}"
    echo "  - Cherry-pick your commits from $CURRENT_BRANCH onto the new branch"
    echo "  - Re-run submit-and-exit"
    echo ""
    echo "Do NOT proceed past this gate."
    gc runtime drain-ack
    exit 1
fi
```

Also confirm `metadata.branch` reflects this branch (workspace-setup
recorded it, but a divergent local state would be invisible to the
refinery without this re-check):
```bash
METADATA_BRANCH=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.branch // empty')
if [ "$METADATA_BRANCH" != "$EXPECTED_BRANCH" ]; then
    gc bd update "$WORK_BEAD_ID" --set-metadata branch="$EXPECTED_BRANCH"
fi
```

**2. Final clean-state verification (safeguard):**
```bash
git status --porcelain
```
If ANY output (untracked files, uncommitted changes):
```bash
git add -A
git commit -m "chore: capture remaining work ($WORK_BEAD_ID)" -m "$(cat <<'BODY'
<Explain the remaining changes discovered by final clean-state
verification and why they are safe to hand off.>
BODY
)"
```
This is a belt-and-suspenders check — self-review should have caught this,
but we never push with untracked work left behind.

**2b. Branch-content gate (fails closed — non-negotiable).**

The branch-shape gate proves the branch is *named* right; it does not prove
it *contains* anything. A branch created at the base tip and never committed
to passes every other gate here: the name matches, the tree is clean, and
`git push` of zero commits succeeds and creates the ref, so push verification
sees origin == HEAD. The handoff is then stamped and the bead moves forward
looking like success — a phantom handoff. Only the refinery's own
no-work-on-branch check catches it, one gate slot later; without that check
it merges as a no-op and the bead closes with the work undone. An idle worker
is visible, this is not.

The predicate is deliberately commit-count-only, measured against the
`origin/{{base_branch}}` tip: it catches the phantom handoff — a branch with
nothing on it — at the cheapest point, before any push. It is weaker than the
refinery's canonical `branch_has_real_change`, which also requires a non-empty
`git diff` against the merge-base and therefore additionally catches a net-zero
branch (commit plus revert). That split is intentional: the refinery stays the
backstop for net-zero work. Do not "fix" only one side of the pair.

`git rev-list` failing is not the same answer as "zero commits", and neither is
a licence to hand off: a count that is not a plain number halts under its own
`halt_reason=content_gate_error` rather than falling through to the push. That
is why the count is matched with `case` instead of `[ "$COMMITS_AHEAD" -eq 0 ]`,
which evaluates false — and so fails open — on an empty value.

```bash
COMMITS_AHEAD=$(git rev-list --count "origin/{{base_branch}}..HEAD" 2>/dev/null)
HALT_REASON=""
case "$COMMITS_AHEAD" in
    ''|*[!0-9]*) HALT_REASON=content_gate_error ;;
    0) HALT_REASON=no_commits ;;
esac
if [ -n "$HALT_REASON" ]; then
    echo "BRANCH CONTENT GATE FAILED ($HALT_REASON)"
    echo "  branch:  $EXPECTED_BRANCH"
    if [ "$HALT_REASON" = content_gate_error ]; then
        echo "  commits ahead of origin/{{base_branch}}: could not be measured"
        echo ""
        echo "The count could not be taken (missing or corrupt origin/{{base_branch}},"
        echo "a concurrent prune). A tool error is a suspect, not a licence to merge:"
        echo "an unmeasurable branch is not pushed and no handoff is stamped."
    else
        echo "  commits ahead of origin/{{base_branch}}: 0"
        echo ""
        echo "There is nothing to hand off. Do NOT push and do NOT reassign to the"
        echo "refinery — an empty branch is a phantom handoff, not a completion."
        echo ""
        echo "Uncommitted leftovers are not the cause: the clean-state check above"
        echo "already committed them. Either the work is sitting on another branch,"
        echo "or no change was produced at all."
        echo ""
        echo "If the honest answer is that no code change is warranted (an"
        echo "investigation that concluded 'no', a bead already satisfied by main),"
        echo "that is a legitimate outcome — but it is reported, not handed off."
    fi
    echo ""
    echo "The bead goes back to the pool with this halt recorded; do not re-run"
    echo "submit-and-exit from this session, whose claim is released below."
    gc bd update "$WORK_BEAD_ID" \
      --status=open --assignee="" \
      --set-metadata gc.routed_to="" \
      --set-metadata halt_reason="$HALT_REASON" \
      --append-notes "Halted at submit ($HALT_REASON): no handoff stamped.
$(cat <<'BODY'
<State what you investigated and why no code change is warranted, what blocked
you from producing one, or — for content_gate_error — what left the branch
unmeasurable. A coordinator reads this to decide next steps.>
BODY
)"
    for ESCALATE_TARGET in mayor "${GC_RIG:+$GC_RIG/}{{binding_prefix}}witness"; do
      gc session nudge "$ESCALATE_TARGET" "POLECAT HANDOFF HALT ($HALT_REASON): $WORK_BEAD_ID on $EXPECTED_BRANCH — no handoff stamped; bead returned to the pool open and unassigned. Needs a coordinator decision." \
        || echo "WARNING: could not nudge $ESCALATE_TARGET about $WORK_BEAD_ID; escalate by hand."
    done
    gc runtime drain-ack
    exit 1
fi
```

The halt parks the bead `open` + unassigned + unrouted, which no dispatcher
tier serves and which witness orphan recovery skips (it filters for beads that
*have* an assignee). Left at that, this gate would silently displace the
refinery's `halt_false_completion`, which escalates the same failure class to
mayor and witness. The nudges above keep that escalation, so moving the catch
one gate earlier does not make it quieter.

**3. Push gate — FAIL CLOSED, then push:**

Absent metadata is not consent. A rail expressed only in prose is enforced by
nothing: a bead whose DESCRIPTION says "no push — the mayor publishes" but
which carries no `auto_push` key used to fall straight through to `git push`,
because an absent key yielded the empty string and the empty string is not
`"false"`. Two of the affected rigs are customer repos, and an unintended push
to a customer repo has already caused an unintended prod deploy once. So the
gate reads the bead's prose as well as its metadata, and halts rather than
guess.

The metadata itself is read through a shape-normalising probe, because the one
thing worse than an unenforced rail is a *recorded* rail the gate silently
fails to read: `jq`'s `has()` errors on a string, so on a ledger that serves
`metadata` as a JSON string the explicit `auto_push=false` opt-out used to
evaluate to the empty string and the bead was pushed (gci-to0l). Object, null
and JSON-string payloads are all read; anything else halts.

The `auto_push` VOCABULARY is closed and case-folded: `false`/`no`/`0` are the
opt-out, `true`/`yes`/`1` are consent, a key present with a JSON `null` value is
"nothing recorded". Anything else is an unreadable decision, not consent — the
key is hand-written by humans following the mayor prompt, and reading `False`
or `no` as "push" would fail open on exactly the beads that tried hardest to
say no.

Five outcomes, evaluated in order:

| `auto_push` | Bead prose | Outcome |
|---|---|---|
| unreadable payload, or a value outside the vocabulary | not read | halt at branch-ready **and escalate** — a decision that cannot be read or understood cannot be shown to lack the opt-out |
| `false`, `no`, `0` (any case) | not read | halt at branch-ready — the explicit opt-out |
| absent, or present with a null value | asserts a no-push rail | halt at branch-ready **and escalate** — ambiguous, a human owns the call |
| absent, or present with a null value | no rail | push + refinery handoff — the normal path |
| `true`, `yes`, `1` (any case) | not read | push + refinery handoff — explicit consent |

```bash
WORK_JSON=$(gc bd show "$WORK_BEAD_ID" --json)
BRANCH=$(git branch --show-current)

# The metadata probe — NORMALISED, and fail CLOSED on a payload it cannot read.
#
# jq's has() ERRORS on a string, printing nothing to stdout, so the old probe
# turned a string-shaped metadata payload into "" — and "" is not "false", so
# outcome (a), the EXPLICIT opt-out, silently stopped firing and control
# reached git push. A fail-OPEN on the one outcome nobody expects to be
# conditional, and it inverted the incentive the whole no-push-rail arc has
# been pushing: a bead that recorded its rail properly AS METADATA, and said
# nothing in prose, is exactly the bead with no prose for (b) to match on.
# Reproduced against this gate's own shipped text, 2026-09-05: explicit
# auto_push=false + string-shaped metadata -> PUSH.
#
# MEASURED 2026-09-05 across all 7 active ledgers (control, sb, sb-app,
# gas-city, flinders, arnotts, detmold) through this gate's own probe shape
# (gc bd show <id> --json | jq of .[0].metadata | type): every one serves an
# OBJECT when metadata is present and NULL when it is absent. No ledger serves
# a string today, so this is a latent trap rather than a live hole — but the
# shape is not a guarantee this gate owns: metadata is whatever the ledger
# binding serialises, it varied by rig when the detector this arc grew out of
# was written (that detector normalises object / string / null for exactly this
# reason), and nothing pins it. The normalisation is lifted here now rather
# than on the day it bites.
#
#   object -> read it.
#   null   -> the bead carries no metadata. A legitimate live shape on every
#             rig and the MAJORITY of beads (308 of the 410 open/in_progress
#             beads across the six queryable ledgers), so it must fall through
#             to (b) and never halt.
#   string -> a JSON-encoded object. Parse it, then read it.
#   anything else, a string that does not parse to an object, an auto_push
#             value outside the closed vocabulary, or a probe that fails
#             outright -> UNREADABLE, handled at (a0) below. The vocabulary is
#             closed on purpose: the key is hand-written by humans, and reading
#             `False` or `no` as "any other value -> explicit consent" fails
#             open on the beads that tried hardest to say no. Note this is
#             the OPPOSITE default to the (b) prose scan's empty INPUT case:
#             there, nothing said is a legitimate "no rail"; here, nothing read
#             is a failure to retrieve a decision that may well exist.
AUTO_PUSH=""
META_UNREADABLE=""
if [ -z "$WORK_JSON" ]; then
  META_UNREADABLE=1
elif ! AUTO_PUSH=$(printf '%s' "$WORK_JSON" | jq -r '
      if (type != "array") or (length == 0) or ((.[0] | type) != "object")
      then error("no bead record in the payload")
      else (.[0].metadata
            | if   type == "object" then .
              elif type == "null"   then {}
              elif type == "string" then (fromjson? // "unparseable")
              else "not-an-object" end)
           | if type != "object" then error("metadata is not an object")
             elif has("auto_push") then (.auto_push | tostring | ascii_downcase
                   | if   . == "false" or . == "no"  or . == "0" then "false"
                     elif . == "true"  or . == "yes" or . == "1" then "true"
                     elif . == "null" then ""
                     else error("auto_push value is outside the vocabulary")
                     end)
             else "" end
      end' 2>/dev/null); then
  META_UNREADABLE=1
fi

# (a0) The payload could not be read. Absent metadata is not consent, and
# UNREADABLE metadata is not absent metadata — it is a bead whose recorded
# decision the gate failed to retrieve. Reading the prose instead would be
# guessing, so halt and hand it to a human.
if [ -n "$META_UNREADABLE" ]; then
  echo "metadata unreadable: halting at branch-ready (fail closed) and escalating."
  # --append-notes, NEVER --notes — same rule as the other two halts (gci-3f5u).
  gc bd update "$WORK_BEAD_ID" \
    --status=open --assignee="" \
    --set-metadata branch="$BRANCH" \
    --set-metadata target={{base_branch}} \
    --set-metadata branch_ready=true \
    --set-metadata halt_reason=metadata_unreadable \
    --set-metadata gc.routed_to="" \
    --append-notes "Branch ready: the push gate could not read this bead's push decision — the ledger read returned no bead record, the metadata came in a shape the probe cannot decode, or auto_push carried a value outside the vocabulary (false/no/0 to halt, true/yes/1 to push). A decision that cannot be read cannot be shown to lack auto_push=false, so the gate halted instead of pushing. Re-record the push decision in the vocabulary, then re-sling."
  gc mail send "${GC_RIG:+$GC_RIG/}{{binding_prefix}}witness" \
    -s "HELP: push-gate metadata unreadable on $WORK_BEAD_ID [HIGH]" \
    -m "Halted at branch-ready instead of pushing.

Bead:   $WORK_BEAD_ID
Branch: $BRANCH (local only — NOT pushed)
Reason: the ledger read returned no readable bead record, served the metadata
        in a shape the gate cannot decode (expected an object, a JSON string,
        or null), or carried an auto_push value outside the vocabulary
        (false/no/0 halt, true/yes/1 push, case-folded). The gate cannot tell
        'halt' from 'go', so it halted.

Resolve: check the ledger is healthy, then record the decision as metadata —
  gc bd update $WORK_BEAD_ID --set-metadata auto_push=false   # confirm the halt
  gc bd update $WORK_BEAD_ID --set-metadata auto_push=true    # authorise the push
and re-sling. Use --set-metadata so branch and gc.routed_to survive."
  gc runtime drain-ack
  exit 0
fi

# (a) Explicit opt-out. Never read the prose — the metadata already decided.
if [ "$AUTO_PUSH" = "false" ]; then
  echo "auto_push=false: halting at branch-ready (no push, no refinery handoff)"
  # --append-notes, NEVER --notes. --notes REPLACES the entire notes field, so a
  # halt note written with it destroys whatever the requester left on the bead.
  gc bd update "$WORK_BEAD_ID" \
    --status=open --assignee="" \
    --set-metadata branch="$BRANCH" \
    --set-metadata target={{base_branch}} \
    --set-metadata branch_ready=true \
    --set-metadata halt_reason=auto_push_false \
    --set-metadata gc.routed_to="" \
    --append-notes "Branch ready: auto_push=false (no push, no refinery handoff)"
  gc runtime drain-ack
  exit 0
fi

# (b) No decision recorded. Scan DESCRIPTION + NOTES for a no-push rail.
# Lines about pushing *to main* are a DIFFERENT rail — one every polecat
# already obeys, since it pushes a feature branch and never main — so the
# PHRASE that states it is stripped out and the REMAINDER is matched. Without
# that every bead quoting the standing "polecats do not push to main" rule
# would halt, and a gate that cries wolf gets routed around.
#
# Strip the PHRASE, not the LINE. A line-granular exclusion took any real rail
# that shared a line with a push-to-main mention down with it, and its target
# list included bare `origin` — the remote this gate is about to push to — so
# "do not push to origin" was read as the standing rule. MEASURED 2026-09-08
# against this gate's own shipped patterns: 7 real rail wordings scored zero
# hits and the gate PUSHED, among them "never push to origin — the customer
# tenant is frozen" and "Polecats do not push to main. HALT branch-ready for
# this bead." Narrowing the destination alone closes only 5 of those 7; the
# other 2 need the strip, because rail and quote share one line. All 15
# rail-detection rows keep their verdicts under the strip.
#
# The destination must end on a word boundary, or "never push to
# origin/main-line-customer" loses its rail to the `origin/main` prefix. `/` is
# in the protected class for the same reason `-` and `_` are: "never push to
# main/customer" names a branch UNDER main, not main, and no English sentence
# continues "main/…". `.` cannot join them — "Polecats never push to main. Open
# a PR." would keep its quote and cry wolf — so the dotted-branch case stays in
# the residual below. The text is downcased first because the strip has to catch
# "Do Not Push To Main" and sed's case-insensitive flag is GNU-only; the match
# grep is already -i, so downcasing upstream costs nothing.
#
# KNOWN RESIDUAL, two shapes, both measured 2026-09-09 and both ended by
# recording the rail as auto_push=false:
#   1. A rail whose ONLY signal sits inside the stripped phrase still reads as
#      the standing rule — "never push to main or anywhere else" pushes. So does
#      the dotted-branch form "never push to main.customer, it is frozen", which
#      is the same shape: `.` is unprotectable without sentence semantics.
#      Separating these needs sentence semantics, not a regex, and the cheap cure
#      (keep the line whenever the strip would remove every signal) halts every
#      bead that quotes the standing rule, which is the cry-wolf failure this
#      filter exists to prevent.
#   2. A NORMATIVE sentence about some other system's pushing — "Establish why
#      the sync should not push twice" — halts, because the match arms below
#      cannot tell a requirement about the subject under repair from a rail about
#      this branch. Over-halting is the recoverable direction (a human records
#      auto_push and re-slings) where a missed rail is not, so this is left as a
#      halt rather than narrowed.
#
# Comments are deliberately out of scope: they are discussion, not standing
# instructions, and they self-match on any bead that merely talks about
# no-push rails.
if [ -z "$AUTO_PUSH" ]; then
  # Extract, downcase and strip in CHECKED stages. grep -c prints a count
  # whenever it runs, so a failure INSIDE one long pipe arrives at the match
  # grep as an empty stream and scores 0 — a push. Each stage that can fail is
  # its own command and any failure sets RAIL_HIT=1: an undetermined rail is
  # treated as an asserted one. ${RAIL_HIT:-1} then covers the last stage,
  # where an empty result can only mean grep itself never ran.
  RAIL_HIT=""
  if ! PROSE=$(printf '%s' "$WORK_JSON" | jq -r '(.[0].description // ""), (.[0].notes // "")' 2>/dev/null); then
    RAIL_HIT=1
  elif ! LOWER=$(printf '%s' "$PROSE" | tr '[:upper:]' '[:lower:]'); then
    RAIL_HIT=1
  elif ! SCAN=$(printf '%s' "$LOWER" | sed -E 's#push(ing|es)?[[:space:]]+(directly[[:space:]]+)?to[[:space:]]+(origin/)?(main|master|trunk)([^-[:alnum:]_/]|$)# #g'); then
    RAIL_HIT=1
  else
    # The match arms mirror the vocabulary this gate blesses elsewhere, or the
    # gate fails open on the prose channel for words it accepts in metadata.
    # `must not push`/`should not push` carry the same ([^e]|$) guard as
    # `never push` for consistency, though a modal cannot take the -es/-ed form
    # that guard exists for, so on those two arms it only catches ungrammatical
    # prose. The value arm takes the FULL closed vocabulary — `no` and `0` are
    # the same word as `false` at :450-455, and reading them as consent here
    # while halting on them there is the mismatch this gate is about.
    RAIL_HIT=$(printf '%s' "$SCAN" | grep -Eic 'no[- ]push([^e]|$)|do not push|don.t push|never push([^e]|$)|(must|should) not push([^e]|$)|(mayor|operator|human) publishes|halt[- ]*(at[- ]+)?branch[- ]ready|branch[- ]ready[- ]+halt|auto_push[[:space:]]*=[[:space:]]*(false|no|0)')
  fi
  if [ "${RAIL_HIT:-1}" -gt 0 ]; then
    echo "NO-PUSH RAIL IN PROSE + auto_push ABSENT — halting at branch-ready (fail closed) and escalating."
    # --append-notes, NEVER --notes. This halt cites a rail that is frequently
    # written in the very notes a bare --notes would replace, so replacing them
    # would delete the evidence the halt note tells the reader to go and read.
    gc bd update "$WORK_BEAD_ID" \
      --status=open --assignee="" \
      --set-metadata branch="$BRANCH" \
      --set-metadata target={{base_branch}} \
      --set-metadata branch_ready=true \
      --set-metadata halt_reason=no_push_rail_unresolved \
      --set-metadata gc.routed_to="" \
      --append-notes "Branch ready: DESCRIPTION/NOTES assert a no-push rail but the bead carries no auto_push metadata, so the rail is unenforceable. Halted instead of guessing. Whoever owns the rail: set auto_push=false to confirm the halt, or auto_push=true to authorise the push, then re-sling."
    gc mail send "${GC_RIG:+$GC_RIG/}{{binding_prefix}}witness" \
      -s "HELP: no-push rail unresolved on $WORK_BEAD_ID [HIGH]" \
      -m "Halted at branch-ready instead of pushing.

Bead:   $WORK_BEAD_ID
Branch: $BRANCH (local only — NOT pushed)
Reason: DESCRIPTION/NOTES assert a no-push rail, but metadata.auto_push is
        absent. The push gate cannot tell 'halt' from 'go', so it halted.

Resolve: read the rail, then record the decision as metadata —
  gc bd update $WORK_BEAD_ID --set-metadata auto_push=false   # confirm the halt
  gc bd update $WORK_BEAD_ID --set-metadata auto_push=true    # authorise the push
and re-sling. Use --set-metadata so branch and gc.routed_to survive."
    gc runtime drain-ack
    exit 0
  fi
fi

# (c) Normal path.
git push origin HEAD
PUSH_EXIT=$?
if [ $PUSH_EXIT -ne 0 ]; then
    echo "PUSH FAILED (exit $PUSH_EXIT)"
    echo "Branch '$CURRENT_BRANCH' was NOT pushed to origin."
    echo "Aborting handoff — bead stays with polecat."
    echo ""
    echo "Diagnose the push failure (network, auth, force-needed?) and re-run submit-and-exit."
    gc runtime drain-ack
    exit 1
fi
# Verify the ref is reachable on origin before trusting the push succeeded.
REMOTE_REF=$(git ls-remote origin "refs/heads/$CURRENT_BRANCH" 2>/dev/null | awk '{print $1}')
LOCAL_HEAD=$(git rev-parse HEAD)
if [ -z "$REMOTE_REF" ]; then
    echo "PUSH VERIFICATION FAILED"
    echo "  git push exited 0 but 'git ls-remote' returned no ref for '$CURRENT_BRANCH' on origin."
    echo "  Branch is local-only. Aborting handoff."
    gc runtime drain-ack
    exit 1
fi
if [ "$REMOTE_REF" != "$LOCAL_HEAD" ]; then
    echo "PUSH VERIFICATION FAILED"
    echo "  origin/$CURRENT_BRANCH = $REMOTE_REF"
    echo "  local HEAD             = $LOCAL_HEAD"
    echo "  Branch tip on origin does not match local HEAD. Aborting handoff."
    gc runtime drain-ack
    exit 1
fi
```

**4. Clean up local branch (prevent stale branch accumulation):**
```bash
BRANCH=$(git branch --show-current)
git checkout --detach                 # Detach so we can delete the branch
git branch -D "$BRANCH"              # Branch is pushed; refinery owns it now
```

**5. Update metadata on the work bead:**
```bash
# --append-notes, NEVER --notes — see the note under this block.
gc bd update "$WORK_BEAD_ID" \
  --set-metadata target={{base_branch}} \
  --set-metadata handoff_stage=target_recorded \
  --append-notes "Implemented: <brief summary>"
```
Branch was recorded in workspace-setup and is already in metadata.
This adds the target for the refinery. If an existing pull request was
provided by the caller, `metadata.existing_pr` is preserved for refinery
validation. The refinery records canonical `pr_url` only after verifying
the PR is open and matches the branch, base, and origin repository.

**Every `gc bd update` call in this step uses `--append-notes`. Never use
`--notes`.** The two flags do not differ in emphasis: `--notes` REPLACES the
whole notes field, `--append-notes` appends to it with a newline separator. The
bead you are finishing is not yours — it carries the requester's instructions,
and on a rig it may carry an operator's hold or a prior polecat's handover. A
closing note written with `--notes` deletes all of it, in one call, with no
warning and no diff. That is bead-history destruction by the normal happy path,
which is why it went unnoticed twice.

The rule binds the two halt writes in item 3 hardest, not least. Both of them
tell the reader to go and act on what the bead says — the ambiguity halt asks
whoever owns the rail to resolve a rail that is, in the usual case, written in
the very notes a bare `--notes` would have just deleted. The identity-stamped
bead record is also the city's anchor against nudge-text spoofing, so a rail
that silently erases it is a P1, not a formatting nit. The same rule holds
anywhere a formula writes a note onto a bead it did not create: append.

`handoff_stage=target_recorded` is the stage marker the witness's Step 3a
uses to recognize a polecat that crashed between this step and step 6 and to
complete the handoff instead of respinning the work. It must be written here
and nowhere else: `target` cannot carry that meaning because `gc sling`
accepts it as a mint-time input, nothing ever unsets it, and it survives
refinery rejection. Every path that invalidates "step 5 completed" clears the
marker — `workspace-setup` on each fresh attempt, and both `mol-refinery-patrol`
rejection paths. Every branch-ready halt in the push gate above
(`auto_push_false`, `metadata_unreadable`, `no_push_rail_unresolved`) returns
before this step, as do the push-failure paths, so an unpushed branch never
carries the marker.

**6. Reassign to refinery:**
```bash
REFINERY_TARGET="${GC_RIG:+$GC_RIG/}{{binding_prefix}}refinery"
gc bd update "$WORK_BEAD_ID" --status=open --assignee="$REFINERY_TARGET" --set-metadata gc.routed_to=""
```

`${GC_RIG:+$GC_RIG/}{{binding_prefix}}refinery` resolves to
`$GC_RIG/{{binding_prefix}}refinery` when running inside a rig session,
or `{{binding_prefix}}refinery` when running in an HQ-only city where
the workspace is the rig. Writing a rendered empty rig prefix produces
`/{{binding_prefix}}refinery` and strands beads outside the refinery pool.

Set `assignee` to the configured refinery named-session identity and clear
`gc.routed_to` because the direct assignment is the handoff. Generic pool
demand is represented by unassigned work with `gc.routed_to=<target>`, so
named-session work should not retain pool-demand metadata.

The refinery will pick this up, rebase onto {{base_branch}}, run tests,
merge, and close the bead. If there's a conflict, the refinery puts the
bead back in the pool with `rejection_reason` metadata — a new polecat
picks it up and resumes from the existing branch.

**7. Signal refinery to check for work immediately (belt-and-suspenders):**
```bash
REFINERY_TARGET="${GC_RIG:+$GC_RIG/}{{binding_prefix}}refinery"
gc session wake "$REFINERY_TARGET" || true
gc session nudge "$REFINERY_TARGET" "Run 'gc prime' to check merge queue and begin processing." || true
```

The `gc bd update` in step 6 generates a `bead.updated` event the refinery's
event-watch will see, but that can take up to `event_timeout` seconds. Wake
starts a stopped on_demand session; nudge leaves a visible prompt for a running
one as soon as it is ready for input. Failure is non-fatal: the refinery finds
the work on its next poll.

**8. Signal reconciler and exit.**
```bash
gc runtime drain-ack
exit
```

`gc runtime drain-ack` tells the reconciler to kill this session. The
reconciler only restarts you if the pool check command finds more work.
You are GONE. Done means gone. There is no idle state.

**Exit criteria:** Branch pushed, metadata set, bead reassigned, refinery signaled, drain acknowledged, session exited."""
